<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#1a1a1a; display:flex; justify-content:center; padding:24px 0; font-family:'Inter', sans-serif; }

  .pin {
    width:1000px; height:1500px;
    position:relative;
    overflow:hidden;
    background:#ffffff;
    box-shadow:0 20px 60px rgba(0,0,0,0.4);
  }

  /* PHOTO ZONE — flat, calm, not oversized */
  .photo-zone {
    width:100%; height:860px;
    position:relative;
    background: linear-gradient(180deg, #eef1ea 0%, #dfe4d6 100%);
  }
  .product-wrap {
    position:absolute;
    left:50%; top:54%;
    transform:translate(-50%,-52%);
    width:460px;
  }
  .product-wrap img {
    width:100%;
    display:block;
    filter: drop-shadow(0 20px 14px rgba(30,35,20,0.18));
  }
  .contact-shadow {
    position:absolute;
    left:50%; bottom:250px;
    width:320px; height:36px;
    transform:translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(20,25,15,0.22) 0%, rgba(20,25,15,0) 75%);
  }

  .badge {
    position:absolute; top:32px; left:32px;
    background:#2b2f26;
    color:#f4f2ea;
    font-size:13px;
    font-weight:700;
    letter-spacing:0.6px;
    text-transform:uppercase;
    padding:9px 16px;
    border-radius:4px;
    z-index:5;
  }
  .disclosure {
    position:absolute; top:32px; right:32px;
    background:#ffffff;
    color:#3a3a3a;
    font-size:13px;
    font-weight:600;
    padding:9px 16px;
    border-radius:4px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
    z-index:5;
  }

  /* INFO ZONE — plain white, small type, small button */
  .info-zone {
    width:100%; height:640px;
    background:#ffffff;
    padding:44px 48px 40px 48px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
  }
  .headline {
    font-size:34px;
    font-weight:800;
    line-height:1.28;
    color:#1a1a1a;
    letter-spacing:-0.5px;
    text-transform:uppercase;
    max-width:94%;
  }
  .support {
    font-size:17px;
    font-weight:400;
    color:#767676;
    margin-top:16px;
    line-height:1.55;
    max-width:90%;
  }
  .bottom-row {
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    margin-top:32px;
  }
  .price-now {
    font-size:26px;
    font-weight:800;
    color:#1a1a1a;
  }
  .price-meta {
    font-size:14px;
    color:#9a9a9a;
    margin-top:4px;
  }
  .cta {
    text-decoration:none;
    font-size:15px;
    font-weight:700;
    color:#f4f2ea;
    background:#2b2f26;
    padding:13px 22px;
    border-radius:6px;
    display:inline-flex;
    align-items:center;
    gap:7px;
  }
  .cta .arrow { font-size:14px; }
  .note {
    font-size:11px;
    color:#c2c2c2;
    text-align:center;
    margin-top:22px;
  }
</style>
</head>
